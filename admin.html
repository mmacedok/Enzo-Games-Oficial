<!DOCTYPE html>
<html lang="pt-BR" data-tema="hacker">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Enzo OS — Enzo Games</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#050a05">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <!-- Painel da equipe: uma área de trabalho com programas em janelas (js/os.js). A linha de comando antiga é o programa "Terminal" (terminal.html). -->
    <link rel="stylesheet" href="css/os.css?v=1">
</head>
<body>
    <div class="os" id="os">
        <div class="papel" id="papel" aria-hidden="true"></div>
        <main class="mesa" id="mesa" aria-label="Área de trabalho"></main>
        <div class="janelas" id="janelas"></div>
        <div class="iniciar-menu" id="iniciar-menu" hidden></div>
        <footer class="barra-tarefas" id="barra-tarefas">
            <button class="iniciar" id="iniciar" type="button" aria-haspopup="true"><img src="assets/admin/mascote-terminal.png" alt="" onerror="this.remove()"><span>Enzo OS</span></button>
            <div class="tarefas" id="tarefas"></div>
            <div class="bandeja"><span class="chip-cargo" id="chip-cargo"></span><span class="relogio" id="relogio"></span></div>
        </footer>
        <div class="tela-aviso" id="aviso" hidden></div>
    </div>
    <script src="js/api-cliente.js?v=rev0926e"></script>
    <script src="js/os.js?v=1"></script>

</html>
