# O site mudou para a Cloudflare (docs/PLANO-CLOUDFLARE.md). O Netlify agora só
# redireciona: qualquer endereço de enzo-games.netlify.app vai para o mesmo caminho
# em enzo-games-oficial.pages.dev (a query string vai junto). Sem build nem Function,
# então cada deploy aqui é rápido e não gasta cota com o site de verdade.
[build]
  publish = "netlify/redirecionar"

[[redirects]]
  from = "/*"
  to = "https://enzo-games-oficial.pages.dev/:splat"
  status = 301
  force = true
