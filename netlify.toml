# Deploy no Netlify: atualiza o catálogo e monta dist/ só com o que é público.
[build]
  command = "npm run build:deploy"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Mesmo cache do server.js: páginas e catálogo sempre revalidados; imagens por 7 dias.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# API (login Google, recordes, progresso): netlify/functions/api.mjs responde em /api/*.
# O código vive em api/ (o mesmo que o server.js usa localmente).
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["google-auth-library"]
