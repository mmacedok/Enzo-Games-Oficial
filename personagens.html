    <style>
        .flip-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9998;
            opacity: 0;
            transition: opacity 0.4s ease;
            
        }
        .flip-clone {
            position: fixed;
            z-index: 9999;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            
        }
        #password-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        #password-modal {
            background: #1a1a1a;
            border: 4px solid #d32f2f;
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            max-width: 450px;
            box-shadow: 0 0 40px rgba(211, 47, 47, 0.4);
            color: white;
            font-family: 'Outfit', sans-serif;
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes modalPop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        #password-modal h3 {
            font-family: 'Bangers', cursive;
            color: #d32f2f;
            font-size: 3rem;
            margin-top: 0;
            letter-spacing: 2px;
        }
        #password-modal p {
            font-size: 1.3rem;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        #password-modal input {
            width: 100%;
            padding: 12px;
            font-size: 1.5rem;
            font-family: 'Outfit', sans-serif;
            border: 2px solid #000;
            border-radius: 4px;
            text-align: center;
            margin-bottom: 15px;
            background: #000;
            color: #ffcc00;
            outline: none;
        }
        #password-modal input:focus {
            border-color: #d32f2f;
        }
        #password-modal button {
            background: #d32f2f;
            color: white;
            border: 2px solid #000;
            padding: 10px 20px;
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            
            border-radius: 4px;
            box-shadow: 2px 2px 0px #000;
            transition: all 0.2s ease;
        }
        #password-modal button:hover {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #000;
            background: #f44336;
        }
        .crime-scene-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(45deg, #000, #000 20px, #ffcc00 20px, #ffcc00 40px);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            z-index: 5;
            transition: opacity 0.5s ease;
        }
        .crime-scene-overlay span {
            background: #000;
            color: #ffcc00;
            font-family: 'Bangers', cursive;
            font-size: 2rem;
            padding: 10px 20px;
            border: 4px solid #ffcc00;
            transform: rotate(-10deg);
            box-shadow: 5px 5px 0px rgba(0,0,0,0.8);
            text-shadow: 2px 2px 0px #000;
            text-align: center;
            line-height: 1.2;
        }
    </style>
