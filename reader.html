<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lendo - Enzo Games Site</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦸‍♂️</text></svg>">
    <link rel="stylesheet" href="css/style.css?v=20260916b">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=Luckiest+Guy&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/images.generated.css?v=1">
</head>
<body class="reader-mode">
    <!-- Overlay de Transição Macarronada -->
    <div id="macaroni-wipe" class="macaroni-wipe is-active"></div>

    <div class="reader-ui">
        <!-- Overlay flutuante invisível que guarda as ilhas -->
        <div class="floating-ui-container">
            
            <!-- Ilha da Esquerda: Navegação -->
            <div class="floating-island island-left">
                <button id="back-btn" class="btn-icon btn-island" data-nav="index.html" title="Voltar ao Início">
                    <i class="ri-home-4-line"></i>
                </button>
                <div class="island-divider"></div>
                <select id="chapter-select" class="custom-select island-select" aria-label="Selecione o capítulo">
                    <!-- Opções preenchidas pelo JS -->
                </select>
            </div>

            <!-- Ilha da Direita: Controles e Zoom -->
            <div class="floating-island island-right">
                <button id="zoom-out-btn" class="btn-icon btn-island" title="Reduzir Zoom (-)">
                    <i class="ri-zoom-out-line"></i>
                </button>
                <button id="zoom-reset-btn" class="btn-icon btn-island" title="Zoom Original (100%)">
                    <span id="zoom-level-text">100%</span>
                </button>
                <button id="zoom-in-btn" class="btn-icon btn-island" title="Aumentar Zoom (+)">
                    <i class="ri-zoom-in-line"></i>
                </button>
                <div class="island-divider"></div>
                <button id="fullscreen-btn" class="btn-icon btn-island" title="Tela Cheia">
                    <i class="ri-fullscreen-line"></i>
                </button>
            </div>

        </div>

        <main class="reader-viewport scroll-mode" id="reader-viewport">
            <!-- Imagens do gibi entram aqui -->
            <div class="image-container" id="image-container">
            </div>
        </main>
    </div>

    <div id="password-modal-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 10000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px);">
        <div id="password-modal" style="background: #1a1a1a; border: 4px solid #d32f2f; padding: 40px; border-radius: 8px; text-align: center; max-width: 450px; box-shadow: 0 0 40px rgba(211, 47, 47, 0.4); color: white; font-family: 'Outfit', sans-serif;">
            <h3 style="font-family: 'Bangers', cursive; color: #d32f2f; font-size: 3rem; margin-top: 0; letter-spacing: 2px;">🚨 ALERTA 🚨</h3>
            <p style="font-size: 1.3rem; margin-bottom: 25px; line-height: 1.4;"><strong>CONTEUDO BANIDO EM 456 PAISES</strong><br><br>Insira a senha de acesso confidencial:</p>
            <input type="password" id="password-input" placeholder="Sua senha..." style="width: 100%; padding: 12px; font-size: 1.5rem; font-family: 'Outfit', sans-serif; border: 2px solid #000; border-radius: 4px; text-align: center; margin-bottom: 15px; background: #000; color: #ffcc00; outline: none;">
            <div id="password-error" style="color: #ff5252; font-weight: bold; margin-bottom: 15px; display: none;">❌ SENHA INCORRETA! ACESSO NEGADO.</div>
            <button id="password-submit" style="background: #d32f2f; color: white; border: 2px solid #000; padding: 10px 20px; font-family: 'Bangers', cursive; font-size: 1.5rem;  border-radius: 4px; box-shadow: 2px 2px 0px #000;">DECODIFICAR</button>
            <button id="password-cancel" style="background: #555; color: white; border: 2px solid #000; padding: 10px 20px; font-family: 'Bangers', cursive; font-size: 1.5rem;  border-radius: 4px; box-shadow: 2px 2px 0px #000; margin-left: 10px;">CANCELAR</button>
        </div>
    </div>

    <!-- Único motor de renderização do leitor -->
    <script src="js/images.generated.js?v=1"></script>
    <script src="js/site.js?v=1"></script>
    <script src="js/reader.core.js?v=4"></script>
</body>
</html>
