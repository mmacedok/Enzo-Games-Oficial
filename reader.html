<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lendo — Enzo Games</title>
    <meta name="theme-color" content="#e65100">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css?v=20260926cur">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/images.generated.css?v=1">
</head>
<body class="reader-mode">
    <script>
        // Chegou pela animação de abrir o gibi: esconde a macarronada já no 1º quadro.
        try { if (sessionStorage.getItem('enzo-enter-comic') === '1') document.body.classList.add('enter-from-comic'); } catch {}
    </script>
    <!-- Overlay de Transição Macarronada -->

    <div class="reader-ui">
        <!-- Tira do topo: cada grupo de controles é um quadro de gibi (css: "Leitor: tira do topo") -->
        <div class="floating-ui-container tira-topo">

            <!-- Quadro da esquerda: Enzo (volta à coleção) + recordatório do capítulo -->
            <div class="floating-island island-left tira-quadro">
                <button type="button" id="back-btn" class="tira-casa" data-nav="index.html" title="Voltar para a coleção" aria-label="Voltar para a coleção">
                    <img data-original="assets/enzo-cabeca-logo.png" src="assets/web/86ba0c6f0fe68894-600.webp" srcset="assets/web/86ba0c6f0fe68894-600.webp 600w" sizes="(max-width: 600px) 90vw, 420px" width="600" height="542" alt="" draggable="false">
                </button>
                <label class="tira-recordatorio">
                    <span class="tira-recordatorio-sobre">Você está lendo</span>
                    <select id="chapter-select" class="island-select" aria-label="Escolher o capítulo">
                        <!-- Opções preenchidas pelo JS -->
                    </select>
                </label>
            </div>

            <!-- Quadro da direita: zoom (balão entre − e +), tela cheia e conta -->
            <div class="floating-island island-right tira-quadro">
                <button type="button" id="zoom-out-btn" class="tira-botao" title="Reduzir zoom (-)" aria-label="Reduzir zoom">−</button>
                <button type="button" id="zoom-reset-btn" class="tira-balao" title="Zoom original (0)" aria-label="Zoom original">
                    <span id="zoom-level-text">100%</span>
                </button>
                <button type="button" id="zoom-in-btn" class="tira-botao" title="Aumentar zoom (+)" aria-label="Aumentar zoom">+</button>
                <button type="button" id="fullscreen-btn" class="tira-botao tira-moldura" title="Tela cheia" aria-label="Tela cheia"><span aria-hidden="true"></span></button>
                <div class="conta conta--ilha" data-conta hidden></div>
            </div>

        </div>
        <main class="reader-viewport scroll-mode" id="reader-viewport">
            <!-- Imagens do gibi entram aqui -->
            <div class="image-container" id="image-container">
            </div>
        </main>
    </div>

    <div id="password-modal-overlay" class="password-overlay">
        <div id="password-modal" class="password-modal">
            <h3>🚨 Alerta 🚨</h3>
            <p><strong>Conteúdo banido em 456 países</strong><br>Insira a senha de acesso confidencial:</p>
            <input type="password" id="password-input" placeholder="Sua senha..." autocomplete="off">
            <div id="password-error" class="password-error">❌ Senha incorreta! Acesso negado.</div>
            <div class="password-actions">
                <button type="button" id="password-submit" class="btn btn--danger">Decodificar</button>
                <button type="button" id="password-cancel" class="btn btn--muted">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Único motor de renderização do leitor -->
    <script src="js/images.generated.js?v=1"></script>
    <script src="js/site.js?v=8"></script>
    <script src="js/conquistas.js?v=4"></script>
    <script src="js/auth-widget.js?v=12"></script>
    <script src="js/comentarios.js?v=1"></script>
    <script src="js/reader.core.js?v=14"></script>
</body>
</html>
