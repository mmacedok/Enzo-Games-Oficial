<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lendo — Enzo Games</title>
    <meta name="theme-color" content="#e65100">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css?v=20260923q">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/images.generated.css?v=1">
</head>
<body class="reader-mode">
    <script>
        // Chegou pela animação de abrir o gibi: esconde a macarronada já no 1º quadro.
        try { if (sessionStorage.getItem('enzo-enter-comic') === '1') document.body.classList.add('enter-from-comic'); } catch {}
    </script>
    <!-- Overlay de Transição Macarronada -->
    <div id="macaroni-wipe" class="macaroni-wipe is-active"></div>

    <div class="reader-ui">
        <!-- Overlay flutuante invisível que guarda as ilhas -->
        <div class="floating-ui-container">
            
            <!-- Ilha da Esquerda: Navegação -->
            <div class="floating-island island-left">
                <button type="button" id="back-btn" class="btn-island" data-nav="index.html" title="Voltar ao início" aria-label="Voltar ao início">
                    <i class="ri-home-4-line"></i>
                </button>
                <div class="island-divider"></div>
                <select id="chapter-select" class="island-select" aria-label="Selecione o capítulo">
                    <!-- Opções preenchidas pelo JS -->
                </select>
            </div>

            <!-- Ilha da Direita: Controles e Zoom -->
            <div class="floating-island island-right">
                <button type="button" id="zoom-out-btn" class="btn-island" title="Reduzir zoom (-)" aria-label="Reduzir zoom">
                    <i class="ri-zoom-out-line"></i>
                </button>
                <button type="button" id="zoom-reset-btn" class="btn-island" title="Zoom original (0)" aria-label="Zoom original">
                    <span id="zoom-level-text">100%</span>
                </button>
                <button type="button" id="zoom-in-btn" class="btn-island" title="Aumentar zoom (+)" aria-label="Aumentar zoom">
                    <i class="ri-zoom-in-line"></i>
                </button>
                <div class="island-divider"></div>
                <button type="button" id="fullscreen-btn" class="btn-island" title="Tela cheia" aria-label="Tela cheia">
                    <i class="ri-fullscreen-line"></i>
                </button>
            </div>

        </div>

        <main class="reader-viewport scroll-mode" id="reader-viewport">
            <!-- Imagens do gibi entram aqui -->
            <div class="image-container" id="image-container">
            </div>
        </main>
    </div>

    <div id="password-modal-overlay" class="password-overlay">
        <div id="password-modal" class="password-modal">
            <h3>🚨 Alerta 🚨</h3>
            <p><strong>Conteúdo banido em 456 países</strong><br>Insira a senha de acesso confidencial:</p>
            <input type="password" id="password-input" placeholder="Sua senha..." autocomplete="off">
            <div id="password-error" class="password-error">❌ Senha incorreta! Acesso negado.</div>
            <div class="password-actions">
                <button type="button" id="password-submit" class="btn btn--danger">Decodificar</button>
                <button type="button" id="password-cancel" class="btn btn--muted">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Único motor de renderização do leitor -->
    <script src="js/images.generated.js?v=1"></script>
    <script src="js/site.js?v=6"></script>
    <script src="js/reader.core.js?v=7"></script>
</body>
</html>
